# Pre-commit hooks for GyanSetu TKP
# Install: uv run pre-commit install
# Run all: uv run pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - types-bleach
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, backend/app]
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: pytest-unit-fast
        name: pytest unit (fast)
        entry: uv run pytest backend/tests/unit -q --cov-fail-under=0 --no-cov
        language: system
        pass_filenames: false
        types: [python]
