services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tkp-postgres
    environment:
      POSTGRES_USER: tkp
      POSTGRES_PASSWORD: tkp
      POSTGRES_DB: tkp
    ports:
      - "5433:5432"
    volumes:
      - tkp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tkp -d tkp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tkp_pgdata:
