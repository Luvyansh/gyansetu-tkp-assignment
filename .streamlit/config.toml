[theme]
base = "light"
primaryColor = "#533AFD"
backgroundColor = "#F6F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0D253D"
linkColor = "#533AFD"
borderColor = "#E3E8EE"
codeBackgroundColor = "#F1F4F8"
codeTextColor = "#0D253D"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "0.75rem"
buttonRadius = "9999px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

# Semantic status colors (readable on light backgrounds)
redColor = "#B4235A"
orangeColor = "#9B6829"
yellowColor = "#9B6829"
greenColor = "#176B5C"
blueColor = "#4434D4"
grayColor = "#64718D"

[theme.sidebar]
backgroundColor = "#1C1E54"
secondaryBackgroundColor = "#272968"
textColor = "#FFFFFF"
borderColor = "#4A4D86"
primaryColor = "#B9B9F9"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
