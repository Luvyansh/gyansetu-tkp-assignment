[project]
name = "gyansetu-tkp"
version = "0.1.0"
description = "Teacher Knowledge Package pipeline — document upload to structured TKP via LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "sse-starlette>=2.1.0,<3.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "langgraph>=0.2.50,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "groq>=0.13.0,<1.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "structlog>=24.4.0,<26.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "reportlab>=4.2.0,<5.0.0",
    "bleach>=6.2.0,<7.0.0",
    "httpx>=0.28.0,<1.0.0",
    "streamlit>=1.40.0,<2.0.0",
    "streamlit-lottie>=0.0.5,<1.0.0",
    "plotly>=5.24.0,<6.0.0",
    "ragas>=0.2.0,<1.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "python-magic-bin>=0.4.14,<1.0.0; sys_platform == 'win32'",
    "python-magic>=0.4.27,<1.0.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "bandit>=1.8.0,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "types-bleach>=6.2.0,<7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
markers = [
    "slow: hits real LLM APIs; excluded from default runs",
    "live_llm: requires real GEMINI_API_KEY + GROQ_API_KEY from .env",
]
addopts = "-q -m \"not slow and not live_llm\" --cov=backend/app --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["backend/app"]
omit = ["backend/app/graph/prompts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "frontend", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["N802", "N803", "N806", "E501"]
"migrations/**" = ["E501"]
"frontend/**" = ["E402", "SIM102", "SIM105"]
"frontend/components/theme.py" = ["E402", "E501", "SIM102", "SIM105"]
"evals/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["backend.app"]
exclude = ["migrations/", "evals/", "frontend/"]
plugins = []

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "fitz.*",
    "pdfplumber.*",
    "docx.*",
    "pptx.*",
    "groq.*",
    "google.genai.*",
    "langgraph.*",
    "slowapi.*",
    "magic.*",
    "reportlab.*",
    "ragas.*",
    "sentence_transformers.*",
    "streamlit.*",
    "streamlit_lottie.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["backend/tests", "evals", ".venv"]
# B101: assert used for internal invariants (e.g. router.py groq client), not input validation.
# B105: CheckStatus.PASS = "pass" is an enum status value, not a hardcoded password/secret.
skips = ["B101", "B105"]
